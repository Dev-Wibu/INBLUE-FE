<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02070d" />
    <link rel="icon" href="data:," />
    <title>AI Hologram Holobox</title>
    <style>
      :root { color-scheme: dark; background: #02070d; }
      * { box-sizing: border-box; }
      html, body, #holobox { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #02070d; overscroll-behavior: none; }
      #holobox { position: fixed; inset: 0; touch-action: manipulation; }
      canvas { display: block; width: 100%; height: 100%; outline: none; cursor: pointer; }
      .sr-only {
        position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="holobox" aria-label="Không gian AI Hologram 3D"></main>
    <p id="audio-status" class="sr-only" aria-live="polite">Chạm lõi AI để phát giọng nói.</p>

    <!-- SHADER HOLOGRAM: Fresnel, scanline, pulse và glitch theo từng lát cắt. -->
    <script id="hologram-vertex" type="x-shader/x-vertex">
      uniform float uTime;
      uniform float uAudio;
      uniform float uGlitch;
      varying vec3 vNormalWorld;
      varying vec3 vWorldPosition;
      varying vec3 vObjectPosition;

      float hash(float n) {
        return fract(sin(n) * 43758.5453123);
      }

      void main() {
        vec3 transformed = position;
        float band = step(0.83, sin(position.y * 15.0 + uTime * 24.0));
        float sliceNoise = hash(floor(position.y * 22.0 + uTime * 8.0));
        transformed.x += (sliceNoise - 0.5) * band * uGlitch * 0.16;
        transformed += normal * sin(uTime * 2.0 + position.y * 3.5)
          * (0.012 + uAudio * 0.025);

        vec4 worldPosition = modelMatrix * vec4(transformed, 1.0);
        vWorldPosition = worldPosition.xyz;
        vObjectPosition = position;
        vNormalWorld = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPosition;
      }
    </script>

    <script id="hologram-fragment" type="x-shader/x-fragment">
      uniform float uTime;
      uniform float uAudio;
      uniform float uGlitch;
      uniform vec3 uColor;
      varying vec3 vNormalWorld;
      varying vec3 vWorldPosition;
      varying vec3 vObjectPosition;

      void main() {
        vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
        float fresnel = pow(1.0 - abs(dot(viewDirection, normalize(vNormalWorld))), 2.15);
        float fineLines = smoothstep(
          0.2, 0.92,
          sin((vObjectPosition.y - uTime * 0.72) * 82.0) * 0.5 + 0.5
        );
        float scanBand = pow(
          max(0.0, sin((vObjectPosition.y - uTime * 0.38) * 6.0)), 12.0
        );
        float glitchBand = step(0.88, sin(vObjectPosition.y * 34.0 + uTime * 41.0))
          * uGlitch;
        float energy = 0.42 + fresnel * 1.4 + fineLines * 0.2 + scanBand * 0.85;
        energy += uAudio * (0.7 + scanBand * 1.4) + glitchBand;
        vec3 color = uColor * energy + vec3(0.55, 0.95, 1.0) * scanBand * 0.5;
        float alpha = clamp(
          0.24 + fresnel * 0.42 + scanBand * 0.23 + uAudio * 0.12,
          0.0, 0.68
        );
        gl_FragColor = vec4(color, alpha);
      }
    </script>

    <!-- SHADER PARTICLE: giãn bán kính và tăng kích thước khi có âm thanh. -->
    <script id="particle-vertex" type="x-shader/x-vertex">
      uniform float uTime;
      uniform float uAudio;
      uniform float uPixelRatio;
      attribute float aSeed;
      varying float vAlpha;

      void main() {
        vec3 p = position;
        float angle = uTime * (0.08 + aSeed * 0.08) + aSeed * 6.2831853;
        p.x += sin(angle + p.y) * 0.13;
        p.z += cos(angle + p.y) * 0.13;
        p *= 1.0 + uAudio * (0.08 + aSeed * 0.16);
        vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (1.4 + aSeed * 3.2 + uAudio * 8.0)
          * uPixelRatio * (9.0 / -mvPosition.z);
        vAlpha = 0.2 + aSeed * 0.46 + uAudio * 0.5;
      }
    </script>

    <script id="particle-fragment" type="x-shader/x-fragment">
      uniform vec3 uColor;
      varying float vAlpha;

      void main() {
        float distanceToCenter = length(gl_PointCoord - 0.5);
        float alpha = smoothstep(0.5, 0.03, distanceToCenter) * vAlpha;
        gl_FragColor = vec4(uColor, alpha);
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      // ===================================================================
      // 1. CẤU HÌNH NHANH: màu, câu nói, tốc độ và lượng particle
      // ===================================================================
      const CONFIG = {
        cyan: new THREE.Color("#38e8ff"),
        room: new THREE.Color("#02070d"),
        defaultSpeech:
          "Xin chào. Tôi là trợ lý trí tuệ nhân tạo đang hiện diện trong không gian Holobox ba chiều.",
        hoverSpeed: 0.62,
        scanlineSpeed: 0.72,
        particleCount: 760,
        bloomStrength: 0.94,
      };

      const viewport = document.querySelector("#holobox");
      const status = document.querySelector("#audio-status");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const query = new URLSearchParams(window.location.search);
      const speechText = query.get("text")?.trim() || CONFIG.defaultSpeech;
      const audioUrl = query.get("audio");

      // ===================================================================
      // 2. SCENE + CAMERA CỐ ĐỊNH: không webcam, không tracking
      // ===================================================================
      const scene = new THREE.Scene();
      scene.background = CONFIG.room;
      scene.fog = new THREE.FogExp2(CONFIG.room, 0.035);

      const camera = new THREE.PerspectiveCamera(38, 9 / 16, 0.1, 80);
      camera.position.set(0, 0.1, 15.8);
      camera.lookAt(0, -0.05, -0.8);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.02;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
      renderer.domElement.tabIndex = 0;
      renderer.domElement.setAttribute("role", "button");
      renderer.domElement.setAttribute(
        "aria-label",
        "Chạm vào lõi AI hologram để phát hoặc dừng giọng nói"
      );
      viewport.appendChild(renderer.domElement);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        CONFIG.bloomStrength,
        0.56,
        0.08
      );
      composer.addPass(bloomPass);

      // ===================================================================
      // 3. PHÒNG HOLOBOX: ba tường, trần, sàn và Cyber Grid
      // ===================================================================
      const roomGroup = new THREE.Group();
      scene.add(roomGroup);

      const backMaterial = new THREE.MeshStandardMaterial({
        color: 0x06121b,
        roughness: 0.86,
        metalness: 0.08,
        side: THREE.DoubleSide,
      });
      const sideMaterial = new THREE.MeshStandardMaterial({
        color: 0x030a11,
        roughness: 0.92,
        metalness: 0.04,
        side: THREE.DoubleSide,
      });
      const floorMaterial = new THREE.MeshStandardMaterial({
        color: 0x07131b,
        roughness: 0.48,
        metalness: 0.38,
        side: THREE.DoubleSide,
      });

      function roomSurface(geometry, material, position, rotation, receiveShadow = false) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.copy(position);
        mesh.rotation.copy(rotation);
        mesh.receiveShadow = receiveShadow;
        roomGroup.add(mesh);
        return mesh;
      }

      roomSurface(
        new THREE.PlaneGeometry(6.7, 11.6),
        backMaterial,
        new THREE.Vector3(0, 0.25, -4.4),
        new THREE.Euler(),
        true
      );
      roomSurface(
        new THREE.PlaneGeometry(6.4, 11.6),
        sideMaterial,
        new THREE.Vector3(-3.35, 0.25, -1.2),
        new THREE.Euler(0, Math.PI / 2, 0),
        true
      );
      roomSurface(
        new THREE.PlaneGeometry(6.4, 11.6),
        sideMaterial,
        new THREE.Vector3(3.35, 0.25, -1.2),
        new THREE.Euler(0, -Math.PI / 2, 0),
        true
      );
      roomSurface(
        new THREE.PlaneGeometry(6.7, 6.4),
        floorMaterial,
        new THREE.Vector3(0, -5.08, -1.2),
        new THREE.Euler(-Math.PI / 2, 0, 0),
        true
      );
      roomSurface(
        new THREE.PlaneGeometry(6.7, 6.4),
        sideMaterial,
        new THREE.Vector3(0, 5.58, -1.2),
        new THREE.Euler(Math.PI / 2, 0, 0)
      );

      const grid = new THREE.GridHelper(6.7, 20, 0x35e8ff, 0x123747);
      grid.position.set(0, -5.055, -1.2);
      grid.material.transparent = true;
      grid.material.opacity = 0.32;
      grid.material.depthWrite = false;
      roomGroup.add(grid);

      // Đường tối/sáng ở góc đóng vai trò Ambient Occlusion giả lập.
      const cornerMaterial = new THREE.MeshBasicMaterial({
        color: 0x0b5267,
        transparent: true,
        opacity: 0.28,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      [-3.31, 3.31].forEach((x) => {
        const edge = new THREE.Mesh(
          new THREE.BoxGeometry(0.035, 10.5, 0.035),
          cornerMaterial
        );
        edge.position.set(x, 0.24, -4.33);
        roomGroup.add(edge);
      });

      // Khung kim loại phía trước làm phòng đọc như một chiếc hộp vật lý.
      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x090e13,
        roughness: 0.34,
        metalness: 0.74,
      });
      function frameBar(size, position) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(...size), frameMaterial);
        bar.position.set(...position);
        bar.castShadow = true;
        bar.receiveShadow = true;
        scene.add(bar);
      }
      frameBar([0.5, 11.5, 0.7], [-3.58, 0.2, 2.15]);
      frameBar([0.5, 11.5, 0.7], [3.58, 0.2, 2.15]);
      frameBar([7.65, 0.52, 0.7], [0, 5.72, 2.15]);
      frameBar([7.65, 0.62, 0.86], [0, -5.32, 2.08]);

      scene.add(new THREE.HemisphereLight(0x69e8ff, 0x02050a, 0.48));
      const keyLight = new THREE.DirectionalLight(0xc7f8ff, 2.4);
      keyLight.position.set(-3.2, 5.6, 5.2);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -5;
      keyLight.shadow.camera.right = 5;
      keyLight.shadow.camera.top = 6;
      keyLight.shadow.camera.bottom = -6;
      keyLight.shadow.bias = -0.0002;
      scene.add(keyLight);

      const rimLight = new THREE.PointLight(0x1ddfff, 14, 11, 2);
      rimLight.position.set(0, 0.2, -1.5);
      scene.add(rimLight);

      // ===================================================================
      // 4. MATERIAL HOLOGRAM: Additive + opacity tối đa 0.68
      // ===================================================================
      const hologramUniforms = {
        uTime: { value: 0 },
        uAudio: { value: 0 },
        uGlitch: { value: 0 },
        uColor: { value: CONFIG.cyan.clone() },
      };
      const hologramMaterial = new THREE.ShaderMaterial({
        uniforms: hologramUniforms,
        vertexShader: document.querySelector("#hologram-vertex").textContent,
        fragmentShader: document.querySelector("#hologram-fragment").textContent,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
      });

      // ===================================================================
      // 5. NHÂN VẬT AI ABSTRACT CORE: nhiều lớp quay tạo parallax 3D
      // ===================================================================
      const aiRoot = new THREE.Group();
      aiRoot.position.set(0, -0.15, -0.6);
      scene.add(aiRoot);
      const coreGroup = new THREE.Group();
      aiRoot.add(coreGroup);

      const solidCoreMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x0a5d7a,
        emissive: 0x14d9ff,
        emissiveIntensity: 1.25,
        roughness: 0.18,
        metalness: 0.28,
        transmission: 0.25,
        transparent: true,
        opacity: 0.68,
      });
      const solidCore = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.48, 2),
        solidCoreMaterial
      );
      solidCore.scale.set(0.92, 1.22, 0.92);
      solidCore.castShadow = true;
      coreGroup.add(solidCore);

      const hologramShell = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.92, 4),
        hologramMaterial
      );
      hologramShell.scale.y = 1.18;
      coreGroup.add(hologramShell);

      const wireMaterial = new THREE.MeshBasicMaterial({
        color: 0x6ff5ff,
        wireframe: true,
        transparent: true,
        opacity: 0.42,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const wireShell = new THREE.Mesh(
        new THREE.IcosahedronGeometry(2.08, 1),
        wireMaterial
      );
      wireShell.scale.y = 1.18;
      coreGroup.add(wireShell);

      const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0x44e9ff,
        transparent: true,
        opacity: 0.72,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const rings = [];
      [
        [2.5, 0.027, new THREE.Euler(Math.PI / 2, 0.08, 0.12)],
        [2.28, 0.021, new THREE.Euler(0.25, 0.18, Math.PI / 2)],
        [2.08, 0.018, new THREE.Euler(0.62, 0.18, 0.46)],
      ].forEach(([radius, tube, rotation], index) => {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(radius, tube, 12, 160),
          ringMaterial.clone()
        );
        ring.rotation.copy(rotation);
        ring.userData.spinDirection = index % 2 === 0 ? 1 : -1;
        ring.userData.spinSpeed = 0.22 + index * 0.09;
        coreGroup.add(ring);
        rings.push(ring);
      });

      // Hai quầng dọc gợi silhouette humanoid nhưng vẫn giữ ngôn ngữ abstract.
      const arcMaterial = ringMaterial.clone();
      arcMaterial.opacity = 0.36;
      [-1, 1].forEach((x) => {
        const arc = new THREE.Mesh(
          new THREE.TorusGeometry(1.46, 0.018, 10, 128),
          arcMaterial
        );
        arc.position.x = x * 0.92;
        arc.scale.set(0.66, 1.75, 0.66);
        arc.rotation.y = Math.PI / 2;
        coreGroup.add(arc);
      });

      const beamMaterial = new THREE.MeshBasicMaterial({
        color: 0x4feaff,
        transparent: true,
        opacity: 0.1,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      coreGroup.add(
        new THREE.Mesh(
          new THREE.CylinderGeometry(0.34, 0.7, 6.2, 36, 1, true),
          beamMaterial
        )
      );

      const nucleusMaterial = new THREE.MeshBasicMaterial({
        color: 0xe4feff,
        transparent: true,
        opacity: 0.94,
        blending: THREE.AdditiveBlending,
      });
      const nucleus = new THREE.Mesh(
        new THREE.SphereGeometry(0.34, 32, 24),
        nucleusMaterial
      );
      coreGroup.add(nucleus);
      const nucleusLight = new THREE.PointLight(0x58eaff, 22, 8, 2);
      coreGroup.add(nucleusLight);

      // ===================================================================
      // 6. PARTICLE SYSTEM: nhấp nháy và giãn ra theo âm thanh
      // ===================================================================
      const particlePositions = new Float32Array(CONFIG.particleCount * 3);
      const particleSeeds = new Float32Array(CONFIG.particleCount);
      for (let index = 0; index < CONFIG.particleCount; index += 1) {
        const radius = 2.25 + Math.random() * 2.2;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(THREE.MathUtils.randFloatSpread(2));
        particlePositions[index * 3] = radius * Math.sin(phi) * Math.cos(theta);
        particlePositions[index * 3 + 1] = radius * Math.cos(phi) * 1.2;
        particlePositions[index * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
        particleSeeds[index] = Math.random();
      }
      const particleGeometry = new THREE.BufferGeometry();
      particleGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(particlePositions, 3)
      );
      particleGeometry.setAttribute("aSeed", new THREE.BufferAttribute(particleSeeds, 1));
      const particleUniforms = {
        uTime: { value: 0 },
        uAudio: { value: 0 },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 1.75) },
        uColor: { value: CONFIG.cyan.clone() },
      };
      const particleMaterial = new THREE.ShaderMaterial({
        uniforms: particleUniforms,
        vertexShader: document.querySelector("#particle-vertex").textContent,
        fragmentShader: document.querySelector("#particle-fragment").textContent,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const particles = new THREE.Points(particleGeometry, particleMaterial);
      aiRoot.add(particles);

      // Bóng/phản chiếu năng lượng mềm trên sàn.
      function createGlowTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        const context = canvas.getContext("2d");
        const gradient = context.createRadialGradient(128, 128, 0, 128, 128, 128);
        gradient.addColorStop(0, "rgba(40, 226, 255, 0.72)");
        gradient.addColorStop(0.28, "rgba(30, 148, 255, 0.32)");
        gradient.addColorStop(1, "rgba(2, 9, 18, 0)");
        context.fillStyle = gradient;
        context.fillRect(0, 0, 256, 256);
        return new THREE.CanvasTexture(canvas);
      }
      const floorGlowMaterial = new THREE.MeshBasicMaterial({
        map: createGlowTexture(),
        transparent: true,
        opacity: 0.74,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const floorGlow = new THREE.Mesh(
        new THREE.PlaneGeometry(5.2, 4.1),
        floorGlowMaterial
      );
      floorGlow.rotation.x = -Math.PI / 2;
      floorGlow.position.set(0, -5.03, -0.5);
      scene.add(floorGlow);

      // ===================================================================
      // 7. AUDIO / TTS
      // ?text=Noi%20dung hoặc ?audio=/audio/assistant.mp3
      // Chạm vào lõi để tuân thủ autoplay policy của trình duyệt.
      // ===================================================================
      const audio = new Audio();
      audio.preload = "metadata";
      audio.crossOrigin = "anonymous";
      if (audioUrl) audio.src = audioUrl;
      let audioContext = null;
      let analyser = null;
      let analyserData = null;
      let sourceNode = null;
      let speaking = false;
      let speechPulse = 0;

      async function unlockAudio() {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioContext = new AudioContextClass();
        }
        if (audioContext?.state === "suspended") await audioContext.resume();
      }

      function connectAnalyser() {
        if (!audioContext || sourceNode) return;
        sourceNode = audioContext.createMediaElementSource(audio);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.82;
        analyserData = new Uint8Array(analyser.frequencyBinCount);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
      }

      function stopVoice() {
        audio.pause();
        window.speechSynthesis?.cancel();
        speaking = false;
        status.textContent = "Đã dừng giọng nói.";
      }

      async function toggleVoice() {
        await unlockAudio();
        if (speaking || !audio.paused || window.speechSynthesis?.speaking) {
          stopVoice();
          return;
        }

        speechPulse = 1;
        if (audioUrl) {
          connectAnalyser();
          audio.currentTime = 0;
          try {
            await audio.play();
            speaking = true;
            status.textContent = "AI đang phát âm thanh.";
          } catch (error) {
            console.error("Không thể phát file âm thanh:", error);
            status.textContent = "Không thể phát file âm thanh.";
          }
          return;
        }

        if (!("speechSynthesis" in window)) {
          status.textContent = "Trình duyệt không hỗ trợ đọc văn bản.";
          return;
        }
        const utterance = new SpeechSynthesisUtterance(speechText);
        utterance.lang = "vi-VN";
        utterance.rate = 0.94;
        utterance.pitch = 1.02;
        utterance.volume = 1;
        const voices = window.speechSynthesis.getVoices();
        const vietnameseVoice = voices.find((voice) =>
          voice.lang.toLowerCase().startsWith("vi")
        );
        if (vietnameseVoice) utterance.voice = vietnameseVoice;
        utterance.onstart = () => {
          speaking = true;
          status.textContent = "AI đang nói.";
        };
        utterance.onboundary = () => {
          speechPulse = Math.min(1, speechPulse + 0.38);
        };
        utterance.onend = () => {
          speaking = false;
          status.textContent = "Chạm lõi AI để nghe lại.";
        };
        utterance.onerror = () => {
          speaking = false;
          status.textContent = "Không thể phát giọng nói.";
        };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }

      audio.addEventListener("ended", () => {
        speaking = false;
        status.textContent = "Chạm lõi AI để nghe lại.";
      });

      // Chỉ chạm đúng lõi AI mới phát âm thanh.
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const interactiveMeshes = [solidCore, hologramShell, wireShell, nucleus];
      function activateAt(clientX, clientY) {
        const bounds = renderer.domElement.getBoundingClientRect();
        pointer.x = ((clientX - bounds.left) / bounds.width) * 2 - 1;
        pointer.y = -((clientY - bounds.top) / bounds.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        if (raycaster.intersectObjects(interactiveMeshes, false).length) toggleVoice();
      }
      renderer.domElement.addEventListener("pointerup", (event) => {
        activateAt(event.clientX, event.clientY);
      });
      renderer.domElement.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleVoice();
        }
      });

      // ===================================================================
      // 8. ANIMATION: floating, breathing, glitch và voice reactivity
      // ===================================================================
      const clock = new THREE.Clock();
      let nextGlitchAt = 2.5 + Math.random() * 3;
      let glitchUntil = 0;
      let smoothedAudio = 0;

      function readAudioLevel(time) {
        if (audioUrl && analyser && analyserData && !audio.paused) {
          analyser.getByteFrequencyData(analyserData);
          let energy = 0;
          const upperBand = Math.min(48, analyserData.length);
          for (let index = 2; index < upperBand; index += 1) {
            energy += analyserData[index];
          }
          return Math.min(1, energy / ((upperBand - 2) * 150));
        }
        // speechSynthesis không nối vào AnalyserNode nên dùng envelope giả lập.
        if (speaking || window.speechSynthesis?.speaking) {
          const rhythm =
            Math.sin(time * 12.7) * 0.25 +
            Math.sin(time * 20.3 + 0.8) * 0.18 +
            Math.sin(time * 7.1 + 1.7) * 0.16;
          return THREE.MathUtils.clamp(
            0.38 + rhythm + speechPulse * 0.34,
            0.08,
            1
          );
        }
        return 0;
      }

      renderer.setAnimationLoop(() => {
        const time = clock.getElapsedTime();
        const motion = reducedMotion ? 0.18 : 1;
        const rawAudio = readAudioLevel(time);
        smoothedAudio = THREE.MathUtils.lerp(smoothedAudio, rawAudio, 0.12);
        speechPulse *= 0.9;

        if (!reducedMotion && time >= nextGlitchAt) {
          glitchUntil = time + THREE.MathUtils.randFloat(0.055, 0.16);
          nextGlitchAt = time + THREE.MathUtils.randFloat(2.4, 6.5);
        }
        const glitching = time < glitchUntil;
        const glitchAmount = glitching ? THREE.MathUtils.randFloat(0.45, 1) : 0;
        const hover = Math.sin(time * CONFIG.hoverSpeed) * 0.18 * motion;
        const breathe =
          1 + Math.sin(time * 1.18) * 0.022 * motion + smoothedAudio * 0.065;

        aiRoot.position.y = -0.15 + hover;
        aiRoot.position.x = glitching ? THREE.MathUtils.randFloatSpread(0.12) : 0;
        aiRoot.rotation.y = Math.sin(time * 0.24) * 0.18 * motion;
        coreGroup.scale.setScalar(breathe);
        solidCore.rotation.y = time * 0.12 * motion;
        solidCore.rotation.x = Math.sin(time * 0.34) * 0.12 * motion;
        hologramShell.rotation.y = -time * (0.16 + smoothedAudio * 0.28) * motion;
        hologramShell.rotation.z = time * 0.07 * motion;
        wireShell.rotation.y = time * (0.22 + smoothedAudio * 0.4) * motion;
        wireShell.rotation.x = -time * 0.09 * motion;

        rings.forEach((ring, index) => {
          ring.rotation.z +=
            ring.userData.spinDirection *
            ring.userData.spinSpeed *
            (0.008 + smoothedAudio * 0.02) *
            motion;
          ring.material.opacity =
            0.52 + smoothedAudio * 0.36 + Math.sin(time * 1.4 + index) * 0.08;
        });

        particles.rotation.y = time * (0.035 + smoothedAudio * 0.08) * motion;
        particles.rotation.z = Math.sin(time * 0.16) * 0.08 * motion;
        nucleus.scale.setScalar(
          1 + smoothedAudio * 0.85 + Math.sin(time * 3.1) * 0.08 * motion
        );
        nucleusLight.intensity = 18 + smoothedAudio * 48;
        rimLight.intensity = 12 + smoothedAudio * 30;
        floorGlow.scale.setScalar(
          1 + smoothedAudio * 0.18 + Math.sin(time * 0.7) * 0.025 * motion
        );
        floorGlowMaterial.opacity = 0.52 + smoothedAudio * 0.34;
        hologramUniforms.uTime.value = time * CONFIG.scanlineSpeed;
        hologramUniforms.uAudio.value = smoothedAudio;
        hologramUniforms.uGlitch.value = glitchAmount;
        particleUniforms.uTime.value = time;
        particleUniforms.uAudio.value = smoothedAudio;
        composer.render();
      });

      // ===================================================================
      // 9. RESPONSIVE 9:16 / FULLSCREEN
      // ===================================================================
      function resize() {
        const width = viewport.clientWidth;
        const height = viewport.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
        renderer.setSize(width, height, false);
        composer.setSize(width, height);
        particleUniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 1.75);
      }
      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(viewport);
      resize();

      window.addEventListener("pagehide", () => {
        stopVoice();
        resizeObserver.disconnect();
        renderer.setAnimationLoop(null);
        audioContext?.close();
      });
    </script>
  </body>
</html>
